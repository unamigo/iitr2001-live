<style>
:root{--brick-deep:#5e1d14;--brick:#8a2f21;--paper:#f6f1e8;--ink:#1d1a17;--muted:#6b625a;--line:#d9cfbf}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--brick-deep);color:#fff;min-height:100vh;display:flex;flex-direction:column}
.photo{position:relative;max-height:46vh;overflow:hidden;background:var(--brick-deep)}
.photo img{display:block;width:100%;height:auto;min-height:180px;max-height:46vh;object-fit:cover;object-position:center 60%}
.photo::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(94,29,20,0) 55%,var(--brick-deep) 100%)}
main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:18px 20px 60px;text-align:center}
.box{max-width:520px;width:100%}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#e6c79a;font-weight:600}
h1{font-family:Fraunces,Georgia,serif;font-weight:400;font-size:clamp(36px,7vw,64px);line-height:1;margin:14px 0 6px}
h1 em{display:block;font-style:italic;font-weight:300;color:#f0d9b5;font-size:.5em;margin-top:.2em}
p{color:#ead9c4;font-size:16px;line-height:1.5;margin:18px 0 24px;font-family:Fraunces,Georgia,serif;font-weight:300}
form{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
input[type=password]{flex:1;min-width:220px;padding:14px 16px;font:16px Inter,system-ui,sans-serif;border:1px solid rgba(255,255,255,.25);border-radius:12px;background:rgba(255,255,255,.08);color:#fff;outline:none}
input[type=password]::placeholder{color:rgba(255,255,255,.45)} input[type=password]:focus{border-color:#f0d9b5}
button{padding:14px 22px;border:0;border-radius:12px;background:#f0d9b5;color:var(--brick-deep);font:600 15px Inter,system-ui,sans-serif;cursor:pointer}
label{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:16px;font-size:13px;color:#d8bfa2;cursor:pointer}
.msg{min-height:22px;margin-top:14px;font-size:14px;color:#ffd2c2}
.shake{animation:sh .35s} @keyframes sh{20%{transform:translateX(-8px)}60%{transform:translateX(8px)}100%{transform:none}}
.hint{margin-top:34px;font-size:12px;color:rgba(255,255,255,.45)}
</style></head><body>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
async function keyFrom(pw,salt){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:300000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt']);}
async function tryOpen(key){const all=b64(BLOB);const salt=all.slice(0,16),iv=all.slice(16,28),ct=all.slice(28);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();}
async function unlock(pw,remember){
  if(!(window.crypto&&crypto.subtle)){return 'nocrypto';}
  try{const all=b64(BLOB);const salt=all.slice(0,16);const key=await keyFrom(pw,salt);
       if(remember){try{const raw=await crypto.subtle.exportKey('raw',key);store.set('iitr2001_k',btoa(String.fromCharCode(...new Uint8Array(raw))));}catch(e){}}
       await tryOpen(key); return true; }catch(e){ store.del('iitr2001_k'); return false; }}
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('go');b.disabled=true;b.textContent='Opening…';document.getElementById('msg').textContent='';
  let ok=false;try{ok=await unlock(document.getElementById('pw').value.trim(),document.getElementById('rem').checked);}catch(e){ok=false;}
  if(ok!==true){b.disabled=false;b.textContent='Open';
    document.getElementById('msg').textContent= ok==='nocrypto' ? 'Your browser opened this page without https. Please use https://iitr2001.live' : 'That is not it. Ask on the batch group.';
    const bx=document.getElementById('box');bx.classList.remove('shake');void bx.offsetWidth;bx.classList.add('shake');}});
(async()=>{if(!(window.crypto&&crypto.subtle))return;const k=store.get('iitr2001_k');if(!k)return;try{const key=await crypto.subtle.importKey('raw',b64(k),{name:'AES-GCM'},true,['decrypt']);await tryOpen(key);}catch(e){store.del('iitr2001_k');}})();
